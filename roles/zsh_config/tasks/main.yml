---
- name: Write ~/.zsh_aliases
  copy:
    dest: "{{ home_dir }}/.zsh_aliases"
    mode: '0644'
    content: |
      alias cc="claude"
      alias cdx="codex"
      alias dev="cd ~/Development"
      alias gs="git status"

- name: Ensure ~/.zshrc exists
  file:
    path: "{{ home_dir }}/.zshrc"
    state: touch
    mode: '0644'
    modification_time: preserve
    access_time: preserve

- name: Source ~/.zsh_aliases from ~/.zshrc
  lineinfile:
    path: "{{ home_dir }}/.zshrc"
    line: 'source ~/.zsh_aliases'
    state: present
